<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How a boat is lifted on the Falkirk Wheel</title>
  <desc id="desc">A process diagram with answer blanks 20 to 26.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0b1b43"/>
    </marker>
    <style>
      .ink{fill:#0b1b43}.muted{fill:#52627e}.line{stroke:#0b1b43;stroke-width:4;fill:none}.soft{fill:#f3f7f5;stroke:#bfd0cc;stroke-width:3}.water{fill:#d9eff6;stroke:#4c90aa;stroke-width:3}.blank{fill:#fff7d2;stroke:#d49c18;stroke-width:3}.label{font:700 22px Arial,sans-serif;fill:#0b1b43}.copy{font:20px Arial,sans-serif;fill:#0b1b43}.small{font:18px Arial,sans-serif;fill:#52627e}.num{font:800 20px Arial,sans-serif;fill:#9a6400}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="600" y="46" text-anchor="middle" class="label">HOW A BOAT IS LIFTED ON THE FALKIRK WHEEL</text>

  <rect x="44" y="86" width="360" height="120" rx="18" class="soft"/>
  <text x="66" y="120" class="copy">A pair of</text>
  <rect x="167" y="94" width="205" height="40" rx="8" class="blank"/>
  <text x="180" y="121" class="num">20</text>
  <text x="66" y="156" class="copy">are lifted to shut out water</text>
  <text x="66" y="184" class="copy">from the canal basin.</text>

  <rect x="44" y="236" width="360" height="112" rx="18" class="soft"/>
  <text x="66" y="272" class="copy">A</text>
  <rect x="94" y="244" width="270" height="40" rx="8" class="blank"/>
  <text x="108" y="271" class="num">21</text>
  <text x="66" y="314" class="copy">is removed, enabling the Wheel to rotate.</text>

  <circle cx="625" cy="360" r="212" fill="#f9fbfa" stroke="#0b1b43" stroke-width="10"/>
  <circle cx="625" cy="360" r="48" fill="#ffcb55" stroke="#0b1b43" stroke-width="8"/>
  <path d="M430 300L820 420M430 420L820 300" class="line" stroke-width="22"/>
  <rect x="403" y="268" width="250" height="78" rx="20" class="water"/>
  <path d="M448 320h160" class="line"/>
  <path d="M500 319l45-28 45 28" fill="#fff" stroke="#0b1b43" stroke-width="4"/>
  <rect x="596" y="330" width="58" height="60" rx="9" class="blank"/>
  <text x="607" y="366" class="num">22</text>
  <text x="674" y="366" class="copy">central</text>
  <rect x="754" y="336" width="182" height="40" rx="8" class="blank"/>
  <text x="767" y="363" class="num">23</text>
  <text x="674" y="405" class="small">A range of different-sized parts keeps</text>
  <text x="674" y="430" class="small">the gondolas upright as the Wheel turns.</text>

  <path d="M845 220H1084" class="line" marker-end="url(#arrow)"/>
  <rect x="862" y="88" width="294" height="108" rx="18" class="soft"/>
  <text x="884" y="125" class="copy">Boat moves directly onto the</text>
  <rect x="884" y="142" width="246" height="40" rx="8" class="blank"/>
  <text x="898" y="169" class="num">24</text>

  <path d="M1070 220V555" class="line" marker-end="url(#arrow)"/>
  <path d="M942 555h208v92H942z" class="water"/>
  <path d="M970 575h152M970 607h152" class="line"/>
  <rect x="886" y="480" width="254" height="55" rx="10" class="soft"/>
  <text x="904" y="514" class="copy">Tunnel beneath Roman</text>
  <rect x="906" y="544" width="220" height="40" rx="8" class="blank"/>
  <text x="920" y="571" class="num">25</text>

  <rect x="500" y="614" width="386" height="104" rx="18" class="soft"/>
  <rect x="526" y="632" width="328" height="40" rx="8" class="blank"/>
  <text x="540" y="659" class="num">26</text>
  <text x="526" y="700" class="copy">raise the boat the remaining 11 metres.</text>
  <path d="M940 650H886" class="line" marker-end="url(#arrow)"/>

  <text x="60" y="734" class="small">Questions 20–26 · Choose ONE WORD from the passage for each answer.</text>
</svg>
