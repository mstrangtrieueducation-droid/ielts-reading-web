name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/ielts-submission/contract.test.cjs --root . --kind reading --manifest tests/ielts-submission/contract.json
      - run: node tests/ielts-submission/client.test.cjs
      - run: node tests/ielts-submission/cross-tab.test.cjs
      - run: DENY_LOCAL=1 node tests/ielts-submission/cross-tab.test.cjs
      - run: node tests/ielts-submission/reading-drafts.regression.test.cjs assets/index-90f0dbd8a1fb.js
      - name: Prepare public site
        run: |
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude .git \
            --exclude .github \
            --exclude tests \
            --exclude node_modules \
            --exclude package-lock.json \
            --exclude _site \
            --exclude internal-review \
            --exclude ielts-reading-web-release.zip
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
